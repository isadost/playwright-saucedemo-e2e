name: Update visual baselines

# Elle tetiklenir: Actions > Update visual baselines > Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Playwright tarayıcısını kur
        run: npx playwright install --with-deps chromium

      # Bilinen hata testleri hariç tutulur; yoksa visual_user'ın hatalı görüntüsü referans olurdu
      - name: Referans görüntüleri üret
        run: npx playwright test --grep @visual --grep-invert @known-bug --update-snapshots

      - name: Değişiklikleri commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__
          if git diff --cached --quiet; then
            echo "Referans görüntülerde değişiklik yok."
          else
            git commit -m "Görsel referans görüntülerini güncelle"
            git push
          fi
